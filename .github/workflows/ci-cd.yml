name: TrueTrace Agent Engine CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test multi-agent engine
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip
    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: Run tests
      env:
        PYTHONPATH: .
      run: python -m pytest -q tests

  docker-hub-push:
    name: Build & Push Agent Engine Image to Docker Hub
    needs: test
    runs-on: ubuntu-latest
    env:
      DOCKER_USER: ${{ secrets.DOCKER_HUB_USERNAME }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.DOCKER_USER != ''
      env:
        DOCKER_USER: ${{ secrets.DOCKER_HUB_USERNAME }}
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: ${{ env.DOCKER_USER != '' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        tags: |
          ${{ secrets.DOCKER_HUB_USERNAME }}/truetrace-agent-engine:latest
          ${{ secrets.DOCKER_HUB_USERNAME }}/truetrace-agent-engine:${{ github.sha }}
